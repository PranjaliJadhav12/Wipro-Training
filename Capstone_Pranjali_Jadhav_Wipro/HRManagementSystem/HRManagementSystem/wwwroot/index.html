<!DOCTYPE html>
<html>
<head>
    <title>HR Management</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--Custom CSS-->
    <link rel="stylesheet" href="style.css" />

</head>
<body class="container mt-4">

    <h2 class="mb-4">HR Management System</h2>

    <div class="card p-3 mb-4">
        <h4>Add Employee</h4>
        <form id="empForm">
            <div class="row">
                <div class="col">
                    <input type="text" id="name" class="form-control" placeholder="Name" required>
                </div>
                <div class="col">
                    <input type="email" id="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="col">
                    <select id="departmentId" class="form-control"></select>
                </div>
                <div class="col">
                    <input type="number" id="leaveBalance" class="form-control" placeholder="Leave Balance" required>
                </div>
                <div class="col">
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </div>
        </form>
    </div>

    <button class="btn btn-success btn-sm mb-3" onclick="getEmployees()">Load Employees</button>

    <table class="table table-bordered" id="empTable">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Leave</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <hr>
    <h3>Leave Requests</h3>

    <form id="leaveForm">
        <select id="leaveEmployeeId"></select>

        <input type="date" id="fromDate" required>
        <input type="date" id="toDate" required>

        <button type="submit">Apply Leave</button>
    </form>

    <br>

    <table class="table table-striped table-bordered table-hover" id="LeaveTable">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>From</th>
                <th>To</th>
                <th>Status</th>
                <th>Action</th>
                <th>Days</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script src="app.js"></script>

</body>
</html>
